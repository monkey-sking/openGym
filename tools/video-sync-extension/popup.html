<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openGym video sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>openGym video sync</h1>
  <p class="lead">The workout and the follow-along video pause and resume together.</p>

  <div class="pair-card">
    <div class="pair-label">4-Digit Pairing Code</div>
    <div id="pair-code" class="pair-code">----</div>
    <p class="pair-sub">Enter this code in openGym on your phone (Workout ⋯ &gt; Video sync) or connect on same Wi-Fi.</p>
  </div>

  <p id="status" class="status">Not connected</p>
  <p id="detail" class="detail"></p>
  <p id="next" class="next"></p>

  <details class="advanced">
    <summary>Advanced / Relay Address</summary>
    <div class="advanced-body">
      <label for="server">Sync Server / Relay Address</label>
      <input id="server" type="url" placeholder="http://127.0.0.1:8787" autocomplete="off" spellcheck="false">
      <div class="row">
        <button id="save" class="primary">Save</button>
        <button id="retry">Reconnect</button>
      </div>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
